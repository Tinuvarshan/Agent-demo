apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-demo-api
  labels:
    app: agent-demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-demo-api
  template:
    metadata:
      labels:
        app: agent-demo-api
    spec:
      containers:
        - name: agent-demo-api
          image: agent-demo-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: agent-demo-api
  labels:
    app: agent-demo-api
spec:
  selector:
    app: agent-demo-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: NodePort